name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      - name: Assemble combined site
        run: |
          mkdir -p site
          cp -r apps/vanilla/dist/. site/
          mkdir -p site/svelte
          cp -r apps/svelte/dist/. site/svelte/

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview
          force: false

name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      - name: Sanity-check vendored wasm isn't an LFS pointer stub
        run: |
          f=vendor/trace_processor/trace_processor.wasm
          if [ -f "$f" ]; then
            size=$(stat -c%s "$f")
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$f is only $size bytes — looks like an unresolved git-lfs pointer, not the real binary. Was actions/checkout run without lfs: true?"
              exit 1
            fi
          fi

      - name: Assemble combined site
        run: |
          mkdir -p site
          cp -r apps/vanilla/dist/. site/
          mkdir -p site/svelte
          cp -r apps/svelte/dist/. site/svelte/

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview
          force: false

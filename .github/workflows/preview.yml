name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22

      - name: Install and build
        if: github.event.action != 'closed'
        run: |
          npm ci
          npm run build

      - name: Sanity-check vendored wasm isn't an LFS pointer stub
        if: github.event.action != 'closed'
        run: |
          f=vendor/trace_processor/trace_processor.wasm
          if [ -f "$f" ]; then
            size=$(stat -c%s "$f")
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$f is only $size bytes — looks like an unresolved git-lfs pointer, not the real binary. Was actions/checkout run without lfs: true?"
              exit 1
            fi
          fi

      - name: Assemble combined site
        if: github.event.action != 'closed'
        run: |
          mkdir -p site
          cp -r apps/vanilla/dist/. site/
          mkdir -p site/svelte
          cp -r apps/svelte/dist/. site/svelte/

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./site/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
